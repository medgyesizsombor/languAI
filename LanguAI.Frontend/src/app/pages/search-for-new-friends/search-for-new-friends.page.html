<app-header
  [title]="title"
  [useNavController]="true"
  [navigateBackRouter]="navigateBackRouter"
  [showBackArrow]="true"></app-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ng-container *ngIf="!isLoading">
    <ng-container *ngIf="userList?.length; else zeroDiscoverableFriendTemplate">
      <ion-row
        *ngFor="let user of userList; let index = index"
        class="ion-justify-content-center">
        <ion-card class="w-100 ion-padding">
          <ion-row>
            <ion-col size="auto" class="ion-padding-end">
              <app-avatar
                [marginClass]="null"
                [widthInPx]="60"
                [heightInPx]="60"
                [imageSrc]="fileService.getImageSrc(user.profilePicture?.contentAsString, user.profilePicture?.type)"></app-avatar>
            </ion-col>
            <ion-col
              class="hidden-text message-text ion-align-items-center d-flex ion-padding-end"
              (click)="openProfile(user.userId)">
              <ion-label class="fs-16 hidden-text">
                {{ user.username }}
              </ion-label>
            </ion-col>
            <ion-col
              size="auto"
              class="d-flex ion-align-items-center ion-justify-content-end">
              <ion-icon
                *ngIf="!user.friendshipStatusEnum"
                class="fs-24"
                (click)="sendFriendshipRequest(user.userId, index)"
                name="person-add-outline"></ion-icon>
              <ion-icon
                *ngIf="user.friendshipStatusEnum === friendshipStatusEnum.Requested"
                class="fs-24"
                name="checkmark-circle-outline"
                (click)="removePendingRequest(user.userId, index)"></ion-icon>
            </ion-col>
          </ion-row>
        </ion-card>
      </ion-row>
    </ng-container>
  </ng-container>
</ion-content>

<ng-template #zeroDiscoverableFriendTemplate>
  <div class="d-flex ion-justify-content-center ion-padding-top">
    <ion-label class="ion-text-center">
      {{ 'CURRENTLY_THERE_IS_NOONE_YOU_COULD_MAKE_A_FRIENDSHIP' | translate }}
    </ion-label>
  </div>
</ng-template>
