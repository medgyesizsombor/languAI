<app-header
  [showAddButton]="true"
  [title]="('CARD_LISTS_TITLE' | translate)"
  (addButtonEmit)="addCardList()"></app-header>
<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list
    *ngIf="!isLoading"
    class="d-flex ion-wrap ion-justify-content-center ion-no-padding">
    <ion-row>
      <ion-col size="11" class="d-flex ion-align-items-center">
        <ion-searchbar
          show-clear-button="always"
          clear-icon="trash-bin-outline"
          placeholder="{{ 'SEARCH' | translate }}"
          (ionInput)="search($event)"
          (ionClear)="clearSearchbar()"></ion-searchbar>
      </ion-col>
      <ion-col
        class="d-flex ion-align-items-center ion-justify-content-end"
        (click)="openSortModal()">
        <ion-icon name="funnel-outline"></ion-icon>
      </ion-col>
    </ion-row>
    <ion-card
      class="border-2"
      *ngFor="let cardList of cardLists"
      (click)="openCardList(cardList.id!)">
      <ion-card-header class="ion-text-center border-2-bottom-line">
        {{ cardList.modified | date:'YYYY. MM. dd' }}
      </ion-card-header>
      <ion-card-content>
        <ion-row>
          <ion-label class="w-100">{{ cardList.name }}</ion-label>
        </ion-row>
        <ion-row>
          <ion-label class="w-100">
            {{ cardList.created | date:'YYYY. MM. dd' }}
          </ion-label>
        </ion-row>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>

<ng-template #missingCardList>
  <ion-row class="ion-justify-content-center" class="w-50">
    <ion-label>{{ 'YOU_DONT_HAVE_ANY_CARD_LIST' | translate }}</ion-label>
  </ion-row>
  <ion-row class="ion-justify-content-center">
    <ion-button expand="block" (click)="addCardList()">
      {{ 'ADD_CARD_LIST' | translate }}
    </ion-button>
  </ion-row>
</ng-template>
