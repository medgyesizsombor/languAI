<ion-tabs>
  <ion-tab-bar mode="md" slot="bottom">
    <ion-tab-button mode="md" tab="lessons">
      <ion-icon class="fs-32" name="book-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button mode="md" tab="card-lists">
      <ion-icon class="fs-32" name="copy-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button mode="md" tab="forum">
      <ion-icon class="fs-32" name="globe-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button mode="md" tab="messages">
      <ion-icon class="fs-32" name="mail-outline"></ion-icon>
    </ion-tab-button>

    <ion-tab-button mode="md" tab="settings">
      <ion-icon class="fs-32" name="settings-outline"></ion-icon>
      <ion-badge
        mode="md"
        *ngIf="numberOfFriendshipRequest"
        id="notifications-badge"
        color="danger">
        {{ numberOfFriendshipRequest}}
      </ion-badge>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
