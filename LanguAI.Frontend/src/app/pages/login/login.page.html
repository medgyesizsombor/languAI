<ion-content class="ion-padding" [fullscreen]="true">
  <h1 class="ion-text-center">LanguAI</h1>
  <ion-img
    class="ion-padding-bottom"
    src="../../../assets/icon/small_logo.png"></ion-img>
  <form *ngIf="loginForm" [formGroup]="loginForm">
    <ion-card class="ion-padding-bottom">
      <ion-row class="ion-padding-top">
        <ion-col class="ion-margin-horizontal">
          <ion-input
            mode="md"
            type="text"
            formControlName="username"
            placeholder="{{ 'USERNAME' | translate}}"></ion-input>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col class="ion-margin-horizontal">
          <ion-input
            mode="md"
            type="password"
            formControlName="password"
            placeholder="{{ 'PASSWORD' | translate}}"></ion-input>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col class="sign-in-button-col">
          <ion-button
            mode="md"
            class="ion-padding-horizontal primary-button w-100 no-shadow"
            (click)="login()">
            {{ 'SIGN_IN' | translate }}
          </ion-button>
        </ion-col>
      </ion-row>
      <ion-row class="ion-text-center">
        <ion-col class="text-col">
          <ion-label mode="md">
            {{ 'IF_YOU_DONT_HAVE_ACCOUNT_SIGN_UP' | translate }}
          </ion-label>
          <ion-label [routerLink]="['/register']" class="line" mode="md">
            {{ 'HERE' | translate}}
          </ion-label>
        </ion-col>
      </ion-row>
    </ion-card>
  </form>
</ion-content>
