<ion-content class="ion-padding" [fullscreen]="true">
  <h1 class="ion-text-center">LanguAI</h1>
  <ion-img src="../../../assets/icon/small_logo.png"></ion-img>
  <form *ngIf="registerForm" [formGroup]="registerForm">
    <ion-row class="ion-padding-top">
      <ion-col class="ion-margin-horizontal">
        <ion-input
          mode="md"
          class="box-shadow"
          type="text"
          formControlName="username"
          placeholder="{{ 'USERNAME' | translate}}"></ion-input>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="ion-margin-horizontal">
        <ion-input
          mode="md"
          class="box-shadow"
          type="email"
          formControlName="email"
          placeholder="{{ 'EMAIL' | translate}}"></ion-input>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col
        class="d-flex ion-justify-content-start ion-margin-horizontal datetime-button-col box-shadow"
        id="open-modal">
        <ion-datetime-button datetime="datetime"></ion-datetime-button>

        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              mode="md"
              presentation="date"
              formControlName="dateOfBirth"
              id="datetime"
              [max]="today"></ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col class="ion-margin-horizontal">
        <ion-input
          mode="md"
          class="box-shadow px-2"
          type="password"
          formControlName="password"
          placeholder="{{ 'PASSWORD' | translate}}"></ion-input>
      </ion-col>
    </ion-row>
    <ion-row class="ion-padding-bottom">
      <ion-col class="ion-margin-horizontal">
        <ion-input
          mode="md"
          class="box-shadow"
          type="password"
          formControlName="confirmPassword"
          placeholder="{{ 'CONFIRM_PASSWORD' | translate}}"></ion-input>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-button
          mode="md"
          class="ion-padding-horizontal primary-button w-100"
          (click)="register()">
          {{ 'SIGN_UP' | translate }}
        </ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-button
          mode="md"
          class="ion-padding-horizontal secondary-button w-100"
          [routerLink]="['/login']">
          {{ 'SIGN_IN' | translate }}
        </ion-button>
      </ion-col>
    </ion-row>
  </form>
</ion-content>
