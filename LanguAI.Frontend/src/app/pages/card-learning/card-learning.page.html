<ion-content [fullscreen]="true" class="ion-padding">
  @if (!showSummary) {
    <app-progress-bar [progress]="progress"></app-progress-bar>
    <div class="main-container">
      @for (card of cards; track card; let i = $index) {
        <div class="container">
          @if (i === currentCardIndex) {
            <ion-card
              [ngClass]="{ 'flipped': isFlipped }"
              (click)="flipCard()">
              <ion-card-content class="front">
                {{ card?.wordInLearningLanguage }}
              </ion-card-content>
              <ion-card-content class="back">
                {{ card?.wordInNativeLanguage }}
              </ion-card-content>
            </ion-card>
          }
        </div>
      }
      <div class="button-container">
        <div class="buttons">
          <ion-button class="error-button" mode="md" (click)="setScore(false)">
            {{ 'MISSED' | translate }}
          </ion-button>
          <ion-button class="success-button" mode="md" (click)="setScore()">
            {{ 'SUCCES' | translate }}
          </ion-button>
        </div>
      </div>
    </div>
  } @else {
    <app-summary
      [statistics]="statistics"
    (navigateBackEmit)="navigateBack()"></app-summary>
  }
</ion-content>
