<div class="card-container">
  <ion-card
    mode="md"
    #deck
    class="card"
    *ngFor="let generatedCard of generatedCards">
    <ion-card-header mode="md">
      <ion-card-title mode="md">
        {{ generatedCard.wordInLearningLanguage }}
      </ion-card-title>
      <ion-card-subtitle mode="md">
        {{ generatedCard.wordInNativeLanguage }}
      </ion-card-subtitle>
    </ion-card-header>
  </ion-card>
</div>
