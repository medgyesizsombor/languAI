<ion-avatar
  class="box-shadow"
  [ngStyle]="{ 'width.px': widthInPx, 'height.px': heightInPx }"
  [ngClass]="marginClass">
  <ion-img
    *ngIf="imageSrc?.length; else missingAvatar"
    [src]="imageSrc"></ion-img>
</ion-avatar>

<ng-template #missingAvatar>
  <ion-img
    src="https://api.hvg.hu/Img/4B5CE600-76FE-4FA2-AC62-7B04F6640281/1e145cd8-6242-4f13-a506-db057fee9bcb.jpg"
    alt="The Wisconsin State Capitol building in Madison, WI at night"></ion-img>
</ng-template>
