<app-header [title]="'NEW_LEARNING' | translate"></app-header>

<ion-content class="ion-padding">
  <div class="form-container">
    @if (!isLoading) {
      @if (newLearningForm) {
        <form
          [formGroup]="newLearningForm"
          class="px-4 d-flex ion-justify-content-center">
          <ion-card class="ion-padding w-100">
            <ion-select
              class="ion-margin-bottom"
              okText="{{ 'CONFIRM' | translate }}"
              cancelText="{{ 'CANCEL' | translate }}"
              formControlName="languageId"
              [label]="'LANGUAGE' | translate"
              label-placement="stacked">
              @for (language of languageList; track language) {
                <ion-select-option
                  [value]="language.id">
                  {{ language.name! | translate }}
                </ion-select-option>
              }
            </ion-select>
            <ion-select
              class="ion-margin-bottom"
              okText="{{ 'CONFIRM' | translate }}"
              cancelText="{{ 'CANCEL' | translate }}"
              formControlName="languageLevel"
              [label]="'LEVEL' | translate"
              label-placement="stacked">
              @for (languageLevel of languageLevelList; track languageLevel) {
                <ion-select-option
                  [value]="languageLevel.id">
                  {{ languageLevel.name! | translate }}
                </ion-select-option>
              }
            </ion-select>
            <ion-row class="ion-margin-bottom w-100">
              <ion-button
                mode="md"
                class="primary-button no-shadow w-100"
                (click)="confirm()">
                {{ 'CONFIRM' | translate }}
              </ion-button>
            </ion-row>
            <ion-row class="w-100">
              <ion-button
                mode="md"
                class="error-outline-button w-100"
                (click)="dismiss()">
                {{ 'CANCEL' | translate }}
              </ion-button>
            </ion-row>
          </ion-card>
        </form>
      }
    }
  </div>
</ion-content>
