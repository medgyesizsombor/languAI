<div class="ion-padding-horizontal">
  <ion-row class="exercise-title">
    <ion-label>
      {{ 'CORRECT_THE_WRONG_SENTENCE' | translate }}
    </ion-label>
  </ion-row>
  <ion-row
    class="ion-text-center w-100 ion-justify-content-center ion-margin-bottom">
    <ion-label>
      {{ 'THIS_IS_THE_INCORRECT_SENTENCE' | translate }}
    </ion-label>
  </ion-row>
  <ion-row class="ion-margin-bottom ion-text-center">
    <ion-card class="ion-padding no-shadow w-100">
      <ion-label>{{ exercise?.mainSentence }}</ion-label>
    </ion-card>
  </ion-row>
  <ion-row class="ion-justify-content-center ion-margin-bottom ion-text-center">
    <ion-label>
      {{ 'WHICH_IS_THE_CORRECTED_SENTENCE_QUESTION' | translate }}
    </ion-label>
  </ion-row>
  <div #container>
    <ion-row
      *ngFor="
        let sentence of exercise?.isCorrectAndTextSentences;
        let index = index
      "
      class="words-container ion-margin-bottom ion-text-center">
      <ion-card
        [ngStyle]="{ background: colors[index % colors.length] }"
        class="word-card"
        (click)="checkSentence(sentence)">
        {{ sentence.text }}
      </ion-card>
    </ion-row>
  </div>
</div>
