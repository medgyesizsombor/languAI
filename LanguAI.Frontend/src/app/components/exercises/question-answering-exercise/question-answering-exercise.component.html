<div class="ion-padding-horizontal">
  <ion-row class="exercise-title">
    <ion-label>
      {{ 'ANSWER_THE_QUESTION' | translate }}
    </ion-label>
  </ion-row>
  <ion-row
    class="ion-text-center w-100 ion-justify-content-center ion-margin-bottom">
    <ion-label>
      {{ 'THIS_IS_THE_QUESTION' | translate }}
    </ion-label>
  </ion-row>
  <ion-row class="ion-margin-bottom ion-text-center">
    <ion-card class="ion-padding w-100 no-shadow">
      <span class="me-1">{{ exercise?.mainSentence }}</span>
    </ion-card>
  </ion-row>
  <ion-row class="ion-justify-content-center ion-margin-bottom ion-text-center">
    <ion-label>
      {{ 'WHICH_IS_THE_ANSWER_FOR_THE_QUESTION_QUESTION' | translate }}
    </ion-label>
  </ion-row>
  <div #container>
    @for (
      sentence of exercise?.isCorrectAndTextSentences; track
      sentence; let index = $index) {
      <ion-row
        class="words-container ion-margin-bottom ion-text-center">
        <ion-card
          class="word-card"
          (click)="checkSentence(sentence)"
          [ngStyle]="{ background: colors[index % colors.length] }">
          {{ sentence.text }}
        </ion-card>
      </ion-row>
    }
  </div>
</div>
