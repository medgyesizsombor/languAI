<div>
  <ion-row class="exercise-title">
    <ion-label class="ion-text-center">
      {{ 'CLICK_ON_THE_MISSING_WORD' | translate }}
    </ion-label>
  </ion-row>

  <div class="row ion-margin-bottom">
    <ion-card class="ion-padding no-shadow">
      <div class="ion-align-items-center label-container">
        <ion-label class="ion-padding-bottom ion-text-center">
          {{ exercise?.firstPartOfTheSentence }}
        </ion-label>
        @if (!isCorrect) {
          <div
            class="d-flex ion-justify-content-center">
            <span class="blank">
              <span style="visibility: hidden">
                {{ exercise?.correctWord }}
              </span>
            </span>
          </div>
        } @else {
          <div class="d-flex ion-justify-content-center">
            <span class="correct-blank">
              <span>
                {{ exercise?.correctWord }}
              </span>
            </span>
          </div>
        }
        <ion-label class="ion-padding-top ion-text-center">
          {{ exercise?.lastPartOfTheSentence }}
        </ion-label>
      </div>
    </ion-card>
  </div>

  <div #container>
    <div class="row missing-words-container">
      @for (word of exercise?.words; track word; let index = $index) {
        <ion-card
          [ngStyle]="{ background: colors[index % colors.length] }"
          class="missing-words ion-text-center"
          (click)="checkWord(word)">
          {{ word }}
        </ion-card>
      }
    </div>
  </div>
</div>
