<ion-fab >
  <ion-fab-button size="small">
    <ion-icon name="ellipsis-vertical-outline"></ion-icon>
  </ion-fab-button>
  <ion-fab-list side="top">
    @if (!isCardListOfOtherUser) {
      <ion-fab-button (click)="playButtonEmit.emit()">
        <ion-icon name="copy-outline"></ion-icon>
      </ion-fab-button>
      <ion-fab-button (click)="addButtonEmit.emit()">
        <ion-icon class="fs-32" name="add"></ion-icon>
      </ion-fab-button>
    } @else {
      <ion-fab-button (click)="copyButtonEmit.emit()">
        <ion-icon class="fs-32" name="cut-outline"></ion-icon>
      </ion-fab-button>
    }
  </ion-fab-list>
</ion-fab>
